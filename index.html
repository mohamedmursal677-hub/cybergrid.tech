<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="0y_oduvby6oG6eX7zVPORHV05bXAGMIY5Kzi7wYdRV8" />
    <title>Cybergrid Tech - Connect 4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --p1-color: #ef4444;
            --p2-color: #eab308;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            max-width: 600px;
            width: 100%;
        }

        h1.game-title {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .status-bar {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            color: var(--text-muted);
            text-align: center;
        }

        .status-bar span {
            color: var(--text-main);
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        button.btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn:hover {
            background-color: var(--primary-hover);
        }

        button.btn-secondary {
            background-color: #1f2937;
            border: 1px solid #374151;
        }

        button.btn-secondary:hover {
            background-color: #374151;
        }

        /* Board Styling */
        .board {
            background-color: #1e3a8a;
            padding: 12px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 4px solid #3b82f6;
        }

        .cell {
            width: 45px;
            height: 45px;
            background-color: var(--bg-color);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.6);
        }

        .cell:hover {
            background-color: #161e2e;
        }

        .disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
            animation: dropDisc 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .disc.p1 {
            background: radial-gradient(circle at 30% 30%, #f87171, #dc2626);
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
        }

        .disc.p2 {
            background: radial-gradient(circle at 30% 30%, #facc15, #ca8a04);
            box-shadow: 0 0 10px rgba(202, 138, 4, 0.5);
        }

        @keyframes dropDisc {
            0% { transform: translateY(-300px); }
            100% { transform: translateY(0); }
        }

        @media (max-width: 500px) {
            .cell { width: 38px; height: 38px; }
            .board { gap: 6px; padding: 8px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">
            <div class="logo-icon">C</div>
            <span>Cybergrid</span>
        </a>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
        </ul>
    </header>

    <div class="game-container">
        <h1 class="game-title">Connect 4</h1>
        <div class="status-bar" id="status">Current Turn: <span id="turn-indicator" style="color: var(--p1-color);">Player 1 (Red)</span></div>
        
        <div class="controls">
            <button class="btn" onclick="resetGame()">Restart Game</button>
            <button class="btn btn-secondary" id="mode-btn" onclick="toggleMode()">Mode: 2 Player</button>
        </div>

        <div class="board" id="board"></div>
    </div>

    <script>
        const ROWS = 6;
        const COLS = 7;
        let board = [];
        let currentPlayer = 1;
        let isGameOver = false;
        let vsAI = false;

        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const modeBtn = document.getElementById('mode-btn');

        function initGame() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
            isGameOver = false;
            currentPlayer = 1;
            updateStatus();
            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.col = c;
                    cell.addEventListener('click', () => handleColumnClick(c));

                    if (board[r][c] !== 0) {
                        const disc = document.createElement('div');
                        disc.classList.add('disc', board[r][c] === 1 ? 'p1' : 'p2');
                        cell.appendChild(disc);
                    }

                    boardElement.appendChild(cell);
                }
            }
        }

        function handleColumnClick(col) {
            if (isGameOver) return;
            if (vsAI && currentPlayer === 2) return;

            if (dropToken(col)) {
                if (checkWin()) {
                    isGameOver = true;
                    statusElement.innerHTML = `<span style="color: ${currentPlayer === 1 ? 'var(--p1-color)' : 'var(--p2-color)'}">Player ${currentPlayer} Wins! 🎉</span>`;
                    return;
                }
                if (checkTie()) {
                    isGameOver = true;
                    statusElement.innerHTML = `<span>It's a Tie! 🤝</span>`;
                    return;
                }

                currentPlayer = currentPlayer === 1 ? 2 : 1;
                updateStatus();

                if (vsAI && currentPlayer === 2 && !isGameOver) {
                    setTimeout(makeAIMove, 400);
                }
            }
        }

        function dropToken(col) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][col] === 0) {
                    board[r][col] = currentPlayer;
                    renderBoard();
                    return true;
                }
            }
            return false;
        }

        function makeAIMove() {
            if (isGameOver) return;
            let availableCols = [];
            for (let c = 0; c < COLS; c++) {
                if (board[0][c] === 0) availableCols.push(c);
            }
            if (availableCols.length === 0) return;

            let col = availableCols[Math.floor(Math.random() * availableCols.length)];
            
            for (let c of availableCols) {
                let r = getDropRow(c);
                board[r][c] = 2;
                if (checkWin()) {
                    board[r][c] = 0;
                    col = c;
                    break;
                }
                board[r][c] = 0;

                board[r][c] = 1;
                if (checkWin()) {
                    board[r][c] = 0;
                    col = c;
                    break;
                }
                board[r][c] = 0;
            }

            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][col] === 0) {
                    board[r][col] = 2;
                    break;
                }
            }

            renderBoard();

            if (checkWin()) {
                isGameOver = true;
                statusElement.innerHTML = `<span style="color: var(--p2-color)">AI Wins! 🤖</span>`;
                return;
            }
            if (checkTie()) {
                isGameOver = true;
                statusElement.innerHTML = `<span>It's a Tie! 🤝</span>`;
                return;
            }

            currentPlayer = 1;
            updateStatus();
        }

        function getDropRow(col) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][col] === 0) return r;
            }
            return -1;
        }

        function checkWin() {
            // Horizontal check
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    let val = board[r][c];
                    if (val !== 0 && val === board[r][c+1] && val === board[r][c+2] && val === board[r][c+3]) return true;
                }
            }
            // Vertical check
            for (let r = 0; r < ROWS - 3; r++) {
                for (let c = 0; c < COLS; c++) {
                    let val = board[r][c];
                    if (val !== 0 && val === board[r+1][c] && val === board[r+2][c] && val === board[r+3][c]) return true;
                }
            }
            // Diagonal (bottom-left to top-right)
            for (let r = 3; r < ROWS; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    let val = board[r][c];
                    if (val !== 0 && val === board[r-1][c+1] && val === board[r-2][c+2] && val === board[r-3][c+3]) return true;
                }
            }
            // Diagonal (top-left to bottom-right)
            for (let r = 0; r < ROWS - 3; r++) {
                for (let c = 0; c < COLS - 3; c++) {
                    let val = board[r][c];
                    if (val !== 0 && val === board[r+1][c+1] && val === board[r+2][c+2] && val === board[r+3][c+3]) return true;
                }
            }
            return false;
        }

        function checkTie() {
            return board[0].every(cell => cell !== 0);
        }

        function updateStatus() {
            if (vsAI && currentPlayer === 2) {
                statusElement.innerHTML = `Current Turn: <span style="color: var(--p2-color);">AI Thinking...</span>`;
            } else {
                const colorStyle = currentPlayer === 1 ? 'var(--p1-color)' : 'var(--p2-color)';
                const name = currentPlayer === 1 ? 'Player 1 (Red)' : (vsAI ? 'AI (Yellow)' : 'Player 2 (Yellow)');
                statusElement.innerHTML = `Current Turn: <span style="color: ${colorStyle};">${name}</span>`;
            }
        }

        function toggleMode() {
            vsAI = !vsAI;
            modeBtn.textContent = vsAI ? "Mode: vs AI" : "Mode: 2 Player";
            resetGame();
        }

        function resetGame() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>
